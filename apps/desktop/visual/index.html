<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>GateReeve Desktop visual fixture</title>
  </head>
  <body>
    <script type="module">
      await import(`./visual-fixture.js${window.location.search}`);
      const fixtureVersion = Date.now();
      const source = await fetch(`../renderer/index.html?fixture=${fixtureVersion}`).then((response) => response.text());
      const parsed = new DOMParser().parseFromString(source, 'text/html');
      parsed.querySelector('script[src="renderer.js"]')?.remove();
      parsed.querySelector('.brand-mark')?.setAttribute(
        'src',
        '../assets/branding/gatereeve-rolling-vale.png',
      );
      const base = document.createElement('base');
      base.href = '../renderer/';
      document.head.replaceChildren(base, ...parsed.head.childNodes);
      document.body.replaceChildren(...parsed.body.childNodes);
      await import(`../renderer/renderer.js?fixture=${fixtureVersion}`);
    </script>
  </body>
</html>
