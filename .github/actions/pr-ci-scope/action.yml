name: Resolve pull-request CI scope
description: Safely reuse a successful predecessor workflow for review-artifact-only commits

inputs:
  workflow-file:
    description: Workflow filename whose predecessor run must have succeeded
    required: true

outputs:
  scope:
    description: full or review-artifacts
    value: ${{ steps.scope.outputs.scope }}
  before:
    description: Synchronize-event predecessor SHA
    value: ${{ steps.scope.outputs.before }}
  after:
    description: Synchronize-event current SHA
    value: ${{ steps.scope.outputs.after }}

runs:
  using: composite
  steps:
    - id: scope
      name: Require an exact successful predecessor before reducing CI
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        EVENT_ACTION: ${{ github.event.action }}
        BEFORE_SHA: ${{ github.event.before }}
        AFTER_SHA: ${{ github.event.after }}
        WORKFLOW_FILE: ${{ inputs.workflow-file }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        scope=full
        if [[ "$EVENT_NAME" == "pull_request" \
          && "$EVENT_ACTION" == "synchronize" \
          && "$BEFORE_SHA" =~ ^[a-f0-9]{40}$ \
          && "$AFTER_SHA" =~ ^[a-f0-9]{40}$ ]] \
          && git merge-base --is-ancestor "$BEFORE_SHA" "$AFTER_SHA"; then
          paths_file="$RUNNER_TEMP/review-artifact-paths"
          git diff --name-only -z "$BEFORE_SHA" "$AFTER_SHA" > "$paths_file"
          path_scope="$(node ci/review-artifact-change.mjs "$paths_file")"
          if [[ "$path_scope" == "review-artifacts" ]]; then
            prior_run_id="$(
              gh api \
                "repos/$GITHUB_REPOSITORY/actions/workflows/$WORKFLOW_FILE/runs?event=pull_request&head_sha=$BEFORE_SHA&status=success&per_page=1" \
                --jq '.workflow_runs[0].id // empty' \
                2>/dev/null || true
            )"
            if [[ -n "$prior_run_id" ]]; then
              scope=review-artifacts
            fi
          fi
        fi
        echo "scope=$scope" >> "$GITHUB_OUTPUT"
        echo "before=$BEFORE_SHA" >> "$GITHUB_OUTPUT"
        echo "after=$AFTER_SHA" >> "$GITHUB_OUTPUT"
        echo "Resolved $WORKFLOW_FILE scope: $scope"
