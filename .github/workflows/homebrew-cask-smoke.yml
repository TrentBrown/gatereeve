name: Homebrew Cask Smoke

on:
  pull_request:
    paths:
      - ".github/workflows/homebrew-cask-smoke.yml"
      - "apps/desktop/scripts/smoke-homebrew-cask.mjs"
      - "apps/desktop/test/homebrew-cask-smoke.test.js"
      - "cli/src/plugin/homebrew-cask.js"
      - "cli/src/plugin/homebrew-cask-v2.js"
      - "cli/src/commands/release.js"
      - "cli/test/homebrew-cask.test.js"
      - "cli/test/cli.test.js"
  workflow_call:
    inputs:
      cask_publication_run_id:
        description: Successful linked Homebrew Cask publication run containing the exact published record
        required: true
        type: string
      release_tag:
        description: Exact published RC tag
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  cask-smoke:
    name: Cask install and upgrade (${{ matrix.native }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - native: arm64
            runner: macos-15
          - native: x64
            runner: macos-15-intel
    env:
      CASK_PUBLICATION_RUN_ID: ${{ inputs.cask_publication_run_id || '33541222023' }}
      RELEASE_TAG: ${{ inputs.release_tag || 'v0.1.0-rc.8' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - run: npm ci --prefix cli
      - name: Bind smoke evidence to successful linked Cask publication
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CASK_PUBLICATION_RUN_ID" > "$RUNNER_TEMP/cask-publication-run.json"
          if [[ "$CASK_PUBLICATION_RUN_ID" != "$GITHUB_RUN_ID" ]]; then
            node -e '
              const run = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"));
              const pullRequestRehearsal = process.env.GITHUB_EVENT_NAME === "pull_request";
              const validConclusion = pullRequestRehearsal
                ? run.conclusion === "success"
                : ["success", "failure", "cancelled"].includes(run.conclusion);
              const validWorkflow = pullRequestRehearsal
                ? /homebrew-cask-publish\.yml$/u.test(run.path)
                : /release-conductor\.yml$/u.test(run.path);
              if (run.event !== "workflow_dispatch"
                || !validConclusion
                || run.head_branch !== "main"
                || !validWorkflow) {
                throw new Error(pullRequestRehearsal
                  ? "PR Cask smoke requires the pinned successful legacy publication run"
                  : "Cask smoke requires a completed Release Conductor run");
              }
            ' "$RUNNER_TEMP/cask-publication-run.json"
          fi
      - name: Download the exact published linked Cask packet
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          repository: TrentBrown/gatereeve
          run-id: ${{ env.CASK_PUBLICATION_RUN_ID }}
          name: gatereeve-${{ env.RELEASE_TAG }}-linked-homebrew-cask-result
          path: ${{ runner.temp }}/homebrew-cask
      - name: Install and upgrade through a disposable local tap
        run: >-
          node apps/desktop/scripts/smoke-homebrew-cask.mjs
          --record "$RUNNER_TEMP/homebrew-cask/cask-record.json"
          --evidence "$RUNNER_TEMP/homebrew-cask-smoke-${{ matrix.native }}.json"
          --architecture "${{ matrix.native }}"
      - uses: actions/upload-artifact@v7
        with:
          name: homebrew-cask-smoke-${{ matrix.native }}
          path: ${{ runner.temp }}/homebrew-cask-smoke-${{ matrix.native }}.json
          if-no-files-found: error

  public-cask-smoke:
    name: Public Cask install (${{ matrix.native }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - native: arm64
            runner: macos-15
          - native: x64
            runner: macos-15-intel
    env:
      CASK_PUBLICATION_RUN_ID: ${{ inputs.cask_publication_run_id || '33541222023' }}
      RELEASE_TAG: ${{ inputs.release_tag || 'v0.1.0-rc.8' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - run: npm ci --prefix cli
      - name: Bind smoke evidence to successful linked Cask publication
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CASK_PUBLICATION_RUN_ID" > "$RUNNER_TEMP/cask-publication-run.json"
          if [[ "$CASK_PUBLICATION_RUN_ID" != "$GITHUB_RUN_ID" ]]; then
            node -e '
              const run = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"));
              const pullRequestRehearsal = process.env.GITHUB_EVENT_NAME === "pull_request";
              const validConclusion = pullRequestRehearsal
                ? run.conclusion === "success"
                : ["success", "failure", "cancelled"].includes(run.conclusion);
              const validWorkflow = pullRequestRehearsal
                ? /homebrew-cask-publish\.yml$/u.test(run.path)
                : /release-conductor\.yml$/u.test(run.path);
              if (run.event !== "workflow_dispatch"
                || !validConclusion
                || run.head_branch !== "main"
                || !validWorkflow) {
                throw new Error(pullRequestRehearsal
                  ? "PR Cask smoke requires the pinned successful legacy publication run"
                  : "Cask smoke requires a completed Release Conductor run");
              }
            ' "$RUNNER_TEMP/cask-publication-run.json"
          fi
      - name: Download the exact published linked Cask packet
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          repository: TrentBrown/gatereeve
          run-id: ${{ env.CASK_PUBLICATION_RUN_ID }}
          name: gatereeve-${{ env.RELEASE_TAG }}-linked-homebrew-cask-result
          path: ${{ runner.temp }}/homebrew-cask
      - name: Install through the literal public tap command
        run: >-
          node apps/desktop/scripts/smoke-homebrew-cask.mjs
          --record "$RUNNER_TEMP/homebrew-cask/cask-record.json"
          --public-tap
          --evidence "$RUNNER_TEMP/public-homebrew-cask-smoke-${{ matrix.native }}.json"
          --architecture "${{ matrix.native }}"
      - uses: actions/upload-artifact@v7
        with:
          name: public-homebrew-cask-smoke-${{ matrix.native }}
          path: ${{ runner.temp }}/public-homebrew-cask-smoke-${{ matrix.native }}.json
          if-no-files-found: error
