name: Coordinated Release Preparation

on:
  workflow_call:
    inputs:
      tag:
        description: Eventual coordinated RC tag (for example v0.1.0-rc.3)
        required: true
        type: string
      source_commit:
        description: Exact reviewed main commit pinned by the Release Conductor
        required: true
        type: string
    secrets:
      GATEREEVE_DEVELOPER_ID_P12_BASE64:
        required: true
      GATEREEVE_DEVELOPER_ID_P12_PASSWORD:
        required: true
      GATEREEVE_NOTARY_KEY_P8_BASE64:
        required: true

permissions:
  actions: read
  contents: read

concurrency:
  group: gatereeve-release-trust-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  resolve-source:
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
      - name: Require the exact pinned reviewed main commit
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          git merge-base --is-ancestor "$SOURCE_COMMIT" refs/remotes/origin/main
      - name: Require an RC preparation tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: node -e "if (!/^v(?:0|[1-9]\\d*)\\.(?:0|[1-9]\\d*)\\.(?:0|[1-9]\\d*)-rc\\.(?:0|[1-9]\\d*)$/.test(process.env.RELEASE_TAG)) process.exit(1)"
      - id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  plugin-candidate:
    needs: resolve-source
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-source.outputs.commit }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - run: npm ci --prefix cli
      - run: bash ci/portable-acceptance.sh
      - name: Prepare the exact Plugin candidate
        run: >-
          node cli/bin/workflow.js plugin release prepare
          --tag "${{ inputs.tag }}"
          --source-commit "${{ needs.resolve-source.outputs.commit }}"
          --output-root "$RUNNER_TEMP/coordinated-plugin-candidate/marketplace"
          --integrity-manifest "$RUNNER_TEMP/coordinated-plugin-candidate/integrity.json"
          --json
      - uses: actions/upload-artifact@v7
        with:
          name: coordinated-plugin-candidate
          path: ${{ runner.temp }}/coordinated-plugin-candidate
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  plugin-candidate-round-trip:
    needs:
      - resolve-source
      - plugin-candidate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-source.outputs.commit }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - run: npm ci --prefix cli
      - uses: actions/download-artifact@v8
        with:
          name: coordinated-plugin-candidate
          path: ${{ runner.temp }}/coordinated-plugin-candidate
      - name: Verify the first Plugin artifact round trip before Apple authority
        run: >-
          node cli/bin/workflow.js plugin release verify-plugin-integrity
          --plugin-root "$RUNNER_TEMP/coordinated-plugin-candidate/marketplace"
          --integrity-manifest "$RUNNER_TEMP/coordinated-plugin-candidate/integrity.json"
          --tag "${{ inputs.tag }}"
          --source-commit "${{ needs.resolve-source.outputs.commit }}"
          --json

  desktop-trust:
    needs:
      - resolve-source
      - plugin-candidate
      - plugin-candidate-round-trip
    runs-on: macos-15
    timeout-minutes: 45
    environment:
      name: release-trust
    env:
      APPLE_TEAM_ID: ${{ vars.GATEREEVE_APPLE_TEAM_ID }}
      APPLE_SIGNING_IDENTITY: ${{ vars.GATEREEVE_DEVELOPER_IDENTITY }}
      APPLE_NOTARY_KEY_ID: ${{ vars.GATEREEVE_NOTARY_KEY_ID }}
      APPLE_NOTARY_ISSUER_ID: ${{ vars.GATEREEVE_NOTARY_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-source.outputs.commit }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci --prefix apps/desktop
      - name: Reject generic reruns after protected trust production begins
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: node -e "if (process.env.RUN_ATTEMPT !== '1') throw new Error('Use retained release-trust artifacts and bounded recovery; generic reruns are prohibited')"
      - name: Validate protected Apple configuration
        run: >-
          node --input-type=module -e
          "import { assertAppleSigningConfiguration } from './apps/desktop/scripts/apple-trust-contract.mjs';
          assertAppleSigningConfiguration({ identity: process.env.APPLE_SIGNING_IDENTITY,
          teamId: process.env.APPLE_TEAM_ID, keyId: process.env.APPLE_NOTARY_KEY_ID,
          issuerId: process.env.APPLE_NOTARY_ISSUER_ID });"
      - name: Import the Developer ID identity into an ephemeral keychain
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.GATEREEVE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.GATEREEVE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.GATEREEVE_NOTARY_KEY_P8_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          for secret_name in APPLE_DEVELOPER_ID_P12_BASE64 APPLE_DEVELOPER_ID_P12_PASSWORD APPLE_NOTARY_KEY_P8_BASE64; do
            test -n "${!secret_name:-}" || { echo "$secret_name is not configured" >&2; exit 1; }
          done
          keychain_path="$RUNNER_TEMP/gatereeve-release.keychain-db"
          keychain_password="$(uuidgen)$(uuidgen)"
          certificate_path="$RUNNER_TEMP/gatereeve-developer-id.p12"
          notary_key_path="$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          original_keychains_path="$RUNNER_TEMP/gatereeve-original-keychains.txt"
          echo "::add-mask::$keychain_password"
          echo "GATEREEVE_EPHEMERAL_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"
          echo "GATEREEVE_CERTIFICATE_PATH=$certificate_path" >> "$GITHUB_ENV"
          echo "GATEREEVE_NOTARY_KEY_PATH=$notary_key_path" >> "$GITHUB_ENV"
          echo "GATEREEVE_ORIGINAL_KEYCHAINS=$original_keychains_path" >> "$GITHUB_ENV"
          security list-keychains -d user > "$original_keychains_path"
          node -e 'require("node:fs").writeFileSync(process.argv[1], Buffer.from(process.env.APPLE_DEVELOPER_ID_P12_BASE64, "base64"))' "$certificate_path"
          node -e 'require("node:fs").writeFileSync(process.argv[1], Buffer.from(process.env.APPLE_NOTARY_KEY_P8_BASE64, "base64"))' "$notary_key_path"
          chmod 600 "$certificate_path" "$notary_key_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$APPLE_DEVELOPER_ID_P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          original_keychains=()
          while IFS= read -r original_keychain; do
            original_keychain="${original_keychain#*\"}"
            original_keychain="${original_keychain%\"*}"
            if [[ -n "$original_keychain" ]]; then
              original_keychains+=("$original_keychain")
            fi
          done < "$original_keychains_path"
          security list-keychains -d user -s \
            "$keychain_path" \
            "${original_keychains[@]}"
          security find-identity -v -p codesigning "$keychain_path" \
            | grep -F "$APPLE_SIGNING_IDENTITY"
      - id: metadata
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
      - id: trusted-package
        name: Build the Developer ID-signed universal DMG
        shell: bash
        run: |
          npm run stage:protocol --prefix apps/desktop
          node apps/desktop/scripts/package-macos.mjs \
            --version "${{ steps.metadata.outputs.version }}" \
            --signing-identity "$APPLE_SIGNING_IDENTITY" \
            --keychain "$GATEREEVE_EPHEMERAL_KEYCHAIN" \
            --result-file "$RUNNER_TEMP/trusted-package.json"
          node -e '
            const value = require("node:fs").readFileSync(process.argv[1], "utf8");
            const result = JSON.parse(value);
            process.stdout.write(`application=${result.applicationPath}\n`);
          ' "$RUNNER_TEMP/trusted-package.json" >> "$GITHUB_OUTPUT"
      - name: Stage immutable submitted bytes and recovery paths
        id: trust-paths
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          trusted_bundle="$RUNNER_TEMP/coordinated-desktop-trusted"
          submitted_root="$trusted_bundle/submitted"
          mkdir -p "$submitted_root"
          submitted_dmg="$submitted_root/GateReeve-${VERSION}-macos-universal.dmg"
          trusted_dmg="$trusted_bundle/GateReeve-${VERSION}-macos-universal.dmg"
          application="${{ steps.trusted-package.outputs.application }}"
          cp "apps/desktop/dist/macos/GateReeve-${VERSION}-macos-universal.dmg" "$submitted_dmg"
          tar -cf "$submitted_root/GateReeve.app.tar" \
            -C "$(dirname "$application")" \
            "$(basename "$application")"
          echo "bundle=$trusted_bundle" >> "$GITHUB_OUTPUT"
          echo "submitted_dmg=$submitted_dmg" >> "$GITHUB_OUTPUT"
          echo "application=$application" >> "$GITHUB_OUTPUT"
          echo "trusted_dmg=$trusted_dmg" >> "$GITHUB_OUTPUT"
      - name: Notarize, staple, and assess the exact DMG
        run: >-
          node apps/desktop/scripts/notarize-macos.mjs
          --application "${{ steps.trust-paths.outputs.application }}"
          --dmg "${{ steps.trust-paths.outputs.submitted_dmg }}"
          --trusted-dmg "${{ steps.trust-paths.outputs.trusted_dmg }}"
          --attempt "${{ steps.trust-paths.outputs.bundle }}/notarization-attempt.json"
          --evidence "${{ steps.trust-paths.outputs.bundle }}/apple-trust.json"
          --source-tag "${{ inputs.tag }}"
          --source-commit "${{ needs.resolve-source.outputs.commit }}"
          --version "${{ steps.metadata.outputs.version }}"
          --identity "$APPLE_SIGNING_IDENTITY"
          --team-id "$APPLE_TEAM_ID"
          --notary-key "$GATEREEVE_NOTARY_KEY_PATH"
          --notary-key-id "$APPLE_NOTARY_KEY_ID"
          --notary-issuer-id "$APPLE_NOTARY_ISSUER_ID"
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: coordinated-desktop-trusted
          path: ${{ runner.temp }}/coordinated-desktop-trusted
          if-no-files-found: error
          retention-days: 30
      - name: Remove Apple credentials and ephemeral keychain
        if: ${{ always() }}
        shell: bash
        run: |
          original_keychains=()
          if [[ -f "${GATEREEVE_ORIGINAL_KEYCHAINS:-}" ]]; then
            while IFS= read -r original_keychain; do
              original_keychain="${original_keychain#*\"}"
              original_keychain="${original_keychain%\"*}"
              if [[ -n "$original_keychain" ]]; then
                original_keychains+=("$original_keychain")
              fi
            done < "$GATEREEVE_ORIGINAL_KEYCHAINS"
          fi
          if (( ${#original_keychains[@]} > 0 )); then
            security list-keychains -d user -s \
              "${original_keychains[@]}" || true
          fi
          if [[ -n "${GATEREEVE_EPHEMERAL_KEYCHAIN:-}" ]]; then
            security delete-keychain "$GATEREEVE_EPHEMERAL_KEYCHAIN" || true
          fi
          rm -f \
            "${GATEREEVE_CERTIFICATE_PATH:-$RUNNER_TEMP/missing-certificate}" \
            "${GATEREEVE_NOTARY_KEY_PATH:-$RUNNER_TEMP/missing-notary-key}" \
            "${GATEREEVE_ORIGINAL_KEYCHAINS:-$RUNNER_TEMP/missing-keychain-list}"

  trusted-desktop-verification:
    needs:
      - resolve-source
      - desktop-trust
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: arm64
            runner: macos-15
          - architecture: x64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-source.outputs.commit }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci --ignore-scripts --prefix apps/desktop
      - uses: actions/download-artifact@v8
        with:
          name: coordinated-desktop-trusted
          path: ${{ runner.temp }}/desktop
      - name: Prepare a real governed runtime fixture
        run: >-
          node apps/desktop/scripts/create-smoke-fixture.mjs
          "$RUNNER_TEMP/gatereeve-desktop-smoke"
      - id: metadata
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Verify the trusted DMG natively
        run: >-
          node apps/desktop/scripts/verify-macos-package.mjs
          --dmg "$RUNNER_TEMP/desktop/GateReeve-${{ steps.metadata.outputs.version }}-macos-universal.dmg"
          --version "${{ steps.metadata.outputs.version }}"
          --fixture "$RUNNER_TEMP/gatereeve-desktop-smoke"
          --native-architecture "${{ matrix.architecture }}"
          --source-tag "${{ inputs.tag }}"
          --source-commit "${{ needs.resolve-source.outputs.commit }}"
          --trust-evidence "$RUNNER_TEMP/desktop/apple-trust.json"
          --evidence "$RUNNER_TEMP/desktop-${{ matrix.architecture }}.json"
      - uses: actions/upload-artifact@v7
        with:
          name: coordinated-desktop-trusted-evidence-${{ matrix.architecture }}
          path: ${{ runner.temp }}/desktop-${{ matrix.architecture }}.json
          if-no-files-found: error
          retention-days: 30

  native-trust-aggregate:
    needs:
      - resolve-source
      - desktop-trust
      - trusted-desktop-verification
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-source.outputs.commit }}
      - uses: actions/download-artifact@v8
        with:
          name: coordinated-desktop-trusted
          path: ${{ runner.temp }}/desktop
      - uses: actions/download-artifact@v8
        with:
          pattern: coordinated-desktop-trusted-evidence-*
          path: ${{ runner.temp }}/evidence
          merge-multiple: true
      - name: Require exactly one native document from each architecture
        run: >-
          node cli/scripts/aggregate-native-trust.js
          --apple-trust "$RUNNER_TEMP/desktop/apple-trust.json"
          --arm64 "$RUNNER_TEMP/evidence/desktop-arm64.json"
          --x64 "$RUNNER_TEMP/evidence/desktop-x64.json"
          --output "$RUNNER_TEMP/native-trust-aggregate.json"
      - uses: actions/upload-artifact@v7
        with:
          name: coordinated-native-trust-aggregate
          path: ${{ runner.temp }}/native-trust-aggregate.json
          if-no-files-found: error
          retention-days: 30

  trusted-release-lifecycle:
    needs:
      - resolve-source
      - plugin-candidate
      - plugin-candidate-round-trip
      - desktop-trust
      - trusted-desktop-verification
      - native-trust-aggregate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-source.outputs.commit }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - run: npm ci --prefix cli
      - uses: actions/download-artifact@v8
        with:
          name: coordinated-plugin-candidate
          path: ${{ runner.temp }}/coordinated-plugin-candidate
      - uses: actions/download-artifact@v8
        with:
          name: coordinated-desktop-trusted
          path: ${{ runner.temp }}/desktop
      - uses: actions/download-artifact@v8
        with:
          pattern: coordinated-desktop-trusted-evidence-*
          path: ${{ runner.temp }}/evidence
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: coordinated-native-trust-aggregate
          path: ${{ runner.temp }}/evidence
      - name: Create the immutable schema-v2 trusted lifecycle
        run: >-
          node cli/scripts/build-trusted-release-lifecycle.js
          --repository "${{ github.server_url }}/${{ github.repository }}"
          --tag "${{ inputs.tag }}"
          --source-commit "${{ needs.resolve-source.outputs.commit }}"
          --plugin-root "$RUNNER_TEMP/coordinated-plugin-candidate/marketplace"
          --plugin-integrity "$RUNNER_TEMP/coordinated-plugin-candidate/integrity.json"
          --apple-trust "$RUNNER_TEMP/desktop/apple-trust.json"
          --native-aggregate "$RUNNER_TEMP/evidence/native-trust-aggregate.json"
          --output "$RUNNER_TEMP/coordinated-release/release-record.json"
      - uses: actions/upload-artifact@v7
        with:
          name: gatereeve-${{ inputs.tag }}-coordinated-release
          path: ${{ runner.temp }}/coordinated-release
          if-no-files-found: error
          retention-days: 30
