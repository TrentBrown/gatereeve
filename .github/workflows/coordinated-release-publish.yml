name: Coordinated Release Publication

on:
  workflow_dispatch:
    inputs:
      finalization_run_id:
        description: Finalization run containing the exact sealed publication packet
        required: true
        type: string
      tag:
        description: Exact candidate RC tag
        required: true
        type: string
      source_commit:
        description: Exact reviewed main commit bound by the packet
        required: true
        type: string
      plan_sha256:
        description: Exact reviewed sealed publication-plan SHA-256
        required: true
        type: string
      mode:
        description: Nonmutating rehearsal or separately approved real publication
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - publish
      approved_by:
        description: Human approver identity; required only for real publication
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: gatereeve-release-publication-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  protected-nonpublishing-rehearsal:
    if: ${{ inputs.mode == 'dry-run' }}
    runs-on: ubuntu-24.04
    environment:
      name: release-publication
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - run: npm ci --prefix cli
      - name: Bind the finalized packet to its exact source workflow
        env:
          GH_TOKEN: ${{ github.token }}
          FINALIZATION_RUN_ID: ${{ inputs.finalization_run_id }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          APPROVED_BY: ${{ inputs.approved_by }}
        shell: bash
        run: |
          set -euo pipefail
          test -z "$APPROVED_BY" || { echo "Dry run must not carry publication approval" >&2; exit 1; }
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          git merge-base --is-ancestor "$SOURCE_COMMIT" refs/remotes/origin/main
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$FINALIZATION_RUN_ID" > "$RUNNER_TEMP/finalization-run.json"
          node -e '
            const run = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"));
            if (run.event !== "workflow_dispatch"
              || run.conclusion !== "success"
              || run.head_sha !== process.env.SOURCE_COMMIT
              || !/coordinated-release-finalize\.yml$/u.test(run.path)) {
              throw new Error("Publication packet is not from the exact approved finalization workflow");
            }
          ' "$RUNNER_TEMP/finalization-run.json"
      - uses: actions/download-artifact@v4
        with:
          name: gatereeve-${{ inputs.tag }}-hosted-publication
          path: ${{ runner.temp }}/hosted-publication
          github-token: ${{ github.token }}
          run-id: ${{ inputs.finalization_run_id }}
      - name: Verify the exact packet and preflight without mutation
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN_SHA256: ${{ inputs.plan_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          node cli/bin/workflow.js plugin release inspect-hosted \
            --release-record "$RUNNER_TEMP/hosted-publication/release-record.json" \
            --json
          node cli/bin/workflow.js plugin release publish-hosted \
            --release-record "$RUNNER_TEMP/hosted-publication/release-record.json" \
            --plan-sha256 "$PLAN_SHA256" \
            --dry-run \
            --json
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: gatereeve-${{ inputs.tag }}-hosted-publication-rehearsal
          path: ${{ runner.temp }}/hosted-publication
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  publish-exact-plan:
    if: ${{ inputs.mode == 'publish' }}
    runs-on: ubuntu-24.04
    environment:
      name: release-publication
    permissions:
      actions: read
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - run: npm ci --prefix cli
      - name: Bind the finalized packet to its exact source workflow
        env:
          GH_TOKEN: ${{ github.token }}
          FINALIZATION_RUN_ID: ${{ inputs.finalization_run_id }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          APPROVED_BY: ${{ inputs.approved_by }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$APPROVED_BY" || { echo "Real publication requires approved_by" >&2; exit 1; }
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          git merge-base --is-ancestor "$SOURCE_COMMIT" refs/remotes/origin/main
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$FINALIZATION_RUN_ID" > "$RUNNER_TEMP/finalization-run.json"
          node -e '
            const run = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"));
            if (run.event !== "workflow_dispatch"
              || run.conclusion !== "success"
              || run.head_sha !== process.env.SOURCE_COMMIT
              || !/coordinated-release-finalize\.yml$/u.test(run.path)) {
              throw new Error("Publication packet is not from the exact approved finalization workflow");
            }
          ' "$RUNNER_TEMP/finalization-run.json"
      - uses: actions/download-artifact@v4
        with:
          name: gatereeve-${{ inputs.tag }}-hosted-publication
          path: ${{ runner.temp }}/hosted-publication
          github-token: ${{ github.token }}
          run-id: ${{ inputs.finalization_run_id }}
      - name: Publish only the exact sealed plan
        env:
          GH_TOKEN: ${{ github.token }}
          GATEREEVE_MARKETPLACE_PUBLISH_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          PLAN_SHA256: ${{ inputs.plan_sha256 }}
          APPROVED_BY: ${{ inputs.approved_by }}
        shell: bash
        run: |
          set -euo pipefail
          node cli/bin/workflow.js plugin release inspect-hosted \
            --release-record "$RUNNER_TEMP/hosted-publication/release-record.json" \
            --json
          node cli/bin/workflow.js plugin release publish-hosted \
            --release-record "$RUNNER_TEMP/hosted-publication/release-record.json" \
            --plan-sha256 "$PLAN_SHA256" \
            --approved-by "$APPROVED_BY" \
            --confirm \
            --json
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: gatereeve-${{ inputs.tag }}-hosted-publication-result
          path: ${{ runner.temp }}/hosted-publication
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
