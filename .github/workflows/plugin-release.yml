name: Plugin Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish-marketplace:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - name: Require a tagged main commit
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - run: npm ci --prefix cli
      - name: Run portable acceptance
        run: bash ci/portable-acceptance.sh
      - name: Prepare release output
        shell: bash
        run: |
          evidence=()
          if [[ "$GITHUB_REF_NAME" != *-* ]]; then
            git show origin/main:docs/releases/ubuntu-rc.json \
              > "$RUNNER_TEMP/ubuntu-rc.json"
            evidence=(--ubuntu-rc-evidence "$RUNNER_TEMP/ubuntu-rc.json")
          fi
          node cli/bin/workflow.js plugin release prepare \
            --tag "$GITHUB_REF_NAME" \
            --source-commit "$GITHUB_SHA" \
            --output-root "$RUNNER_TEMP/workflow-marketplace" \
            "${evidence[@]}" \
            --json
      - name: Publish one complete marketplace tree
        env:
          PUBLISH_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          bash ci/publish-marketplace.sh \
            "$RUNNER_TEMP/workflow-marketplace" \
            "$PUBLISH_URL" \
            "$GITHUB_REF_NAME"
