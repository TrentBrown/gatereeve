name: Linked Homebrew Cask Publication

on:
  workflow_call:
    inputs:
      cask_finalization_run_id:
        description: Finalization run containing the exact linked Cask packet
        required: true
        type: string
      tag:
        description: Exact published GateReeve tag
        required: true
        type: string
      source_commit:
        description: Exact reviewed main commit bound by the Cask packet
        required: true
        type: string
      plan_sha256:
        description: Exact separately reviewed Cask plan SHA-256
        required: true
        type: string
      mode:
        description: Nonmutating rehearsal or separately approved Cask publication
        required: true
        type: string
      approved_by:
        description: Human Cask approver identity; required only for publication
        required: false
        type: string
    secrets:
      GATEREEVE_PUBLICATION_TOKEN:
        required: false

permissions:
  actions: read
  contents: read

concurrency:
  group: gatereeve-cask-publication-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  protected-cask-rehearsal:
    if: ${{ inputs.mode == 'dry-run' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - run: npm ci --prefix cli
      - name: Bind the Cask packet to exact read-only finalization
        env:
          GH_TOKEN: ${{ github.token }}
          CASK_FINALIZATION_RUN_ID: ${{ inputs.cask_finalization_run_id }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          APPROVED_BY: ${{ inputs.approved_by }}
        shell: bash
        run: |
          set -euo pipefail
          test -z "$APPROVED_BY" || { echo "Cask dry run must not carry approval" >&2; exit 1; }
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CASK_FINALIZATION_RUN_ID" > "$RUNNER_TEMP/cask-finalization-run.json"
          if [[ "$CASK_FINALIZATION_RUN_ID" != "$GITHUB_RUN_ID" ]]; then
            node -e '
              const run = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"));
              if (run.event !== "workflow_dispatch"
                || !["success", "failure", "cancelled"].includes(run.conclusion)
                || run.head_branch !== "main"
                || !/release-conductor\.yml$/u.test(run.path)) {
                throw new Error("Cask packet is not from a completed Release Conductor run");
              }
            ' "$RUNNER_TEMP/cask-finalization-run.json"
            cask_finalization_head="$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).head_sha' "$RUNNER_TEMP/cask-finalization-run.json")"
            git merge-base --is-ancestor "$SOURCE_COMMIT" "$cask_finalization_head"
          fi
      - uses: actions/download-artifact@v8
        with:
          name: gatereeve-${{ inputs.tag }}-linked-homebrew-cask
          path: ${{ runner.temp }}/homebrew-cask
          github-token: ${{ github.token }}
          run-id: ${{ inputs.cask_finalization_run_id }}
      - name: Preflight the exact Cask plan without mutation
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN_SHA256: ${{ inputs.plan_sha256 }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          TAG: ${{ inputs.tag }}
        run: |
          node -e '
            const record = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"));
            if (record.source?.commit !== process.env.SOURCE_COMMIT
              || record.source?.tag !== process.env.TAG) {
              throw new Error("Cask packet differs from the requested publication source");
            }
          ' "$RUNNER_TEMP/homebrew-cask/cask-record.json"
          node cli/bin/workflow.js plugin release publish-cask-hosted \
            --cask-record "$RUNNER_TEMP/homebrew-cask/cask-record.json" \
            --plan-sha256 "$PLAN_SHA256" \
            --dry-run \
            --json
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: gatereeve-${{ inputs.tag }}-linked-homebrew-cask-rehearsal
          path: ${{ runner.temp }}/homebrew-cask
          if-no-files-found: error
          retention-days: 30

  publish-exact-cask-plan:
    if: ${{ inputs.mode == 'publish' }}
    runs-on: ubuntu-24.04
    environment:
      name: release-publication
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - run: npm ci --prefix cli
      - name: Bind the Cask packet to exact read-only finalization
        env:
          GH_TOKEN: ${{ github.token }}
          CASK_FINALIZATION_RUN_ID: ${{ inputs.cask_finalization_run_id }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          APPROVED_BY: ${{ inputs.approved_by }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$APPROVED_BY" || { echo "Cask publication requires approved_by" >&2; exit 1; }
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CASK_FINALIZATION_RUN_ID" > "$RUNNER_TEMP/cask-finalization-run.json"
          if [[ "$CASK_FINALIZATION_RUN_ID" != "$GITHUB_RUN_ID" ]]; then
            node -e '
              const run = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"));
              if (run.event !== "workflow_dispatch"
                || !["success", "failure", "cancelled"].includes(run.conclusion)
                || run.head_branch !== "main"
                || !/release-conductor\.yml$/u.test(run.path)) {
                throw new Error("Cask packet is not from a completed Release Conductor run");
              }
            ' "$RUNNER_TEMP/cask-finalization-run.json"
            cask_finalization_head="$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).head_sha' "$RUNNER_TEMP/cask-finalization-run.json")"
            git merge-base --is-ancestor "$SOURCE_COMMIT" "$cask_finalization_head"
          fi
      - uses: actions/download-artifact@v8
        with:
          name: gatereeve-${{ inputs.tag }}-linked-homebrew-cask
          path: ${{ runner.temp }}/homebrew-cask
          github-token: ${{ github.token }}
          run-id: ${{ inputs.cask_finalization_run_id }}
      - name: Publish only the separately approved exact Cask plan
        env:
          GH_TOKEN: ${{ secrets.GATEREEVE_PUBLICATION_TOKEN }}
          PLAN_SHA256: ${{ inputs.plan_sha256 }}
          APPROVED_BY: ${{ inputs.approved_by }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          TAG: ${{ inputs.tag }}
        run: |
          node -e '
            const record = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"));
            if (record.source?.commit !== process.env.SOURCE_COMMIT
              || record.source?.tag !== process.env.TAG) {
              throw new Error("Cask packet differs from the requested publication source");
            }
          ' "$RUNNER_TEMP/homebrew-cask/cask-record.json"
          node cli/bin/workflow.js plugin release publish-cask-hosted \
            --cask-record "$RUNNER_TEMP/homebrew-cask/cask-record.json" \
            --plan-sha256 "$PLAN_SHA256" \
            --approved-by "$APPROVED_BY" \
            --confirm \
            --json
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: gatereeve-${{ inputs.tag }}-linked-homebrew-cask-result
          path: ${{ runner.temp }}/homebrew-cask
          if-no-files-found: error
          retention-days: 30
